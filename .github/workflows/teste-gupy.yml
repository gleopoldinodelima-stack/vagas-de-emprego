name: teste-gupy
on:
  push:
    branches: [claude/project-thread-gtwpci]
  workflow_dispatch:
jobs:
  gupy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Endpoint cru
        run: |
          curl -sS -w "\nHTTP %{http_code}\n" "https://portal.api.gupy.io/api/job?name=assistente%20de%20logistica&offset=0&limit=3" | head -c 3000 || true
      - name: Formato da resposta
        run: |
          curl -sS "https://portal.gupy.io/api/job-search/jobs?jobName=assistente%20de%20logistica&limit=100&offset=0" -o r.json -w "HTTP %{http_code}\n"
          python3 -c "
          import json; d=json.load(open('r.json'))
          print('chaves topo:', {k:(v if k!='data' else len(v)) for k,v in d.items()})
          j=d['data'][0]; j.pop('description',None); print(json.dumps(j,ensure_ascii=False,indent=1))
          "
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Radar (Gupy + filtro)
        run: npx --yes tsx scripts/teste-gupy.mts
